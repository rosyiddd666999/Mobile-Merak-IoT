name: merak
description: "MerakNK / Kampung Merak - Aplikasi peternakan merak"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Routing
  go_router: ^14.8.0

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Charts
  fl_chart: ^0.70.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Fonts
  google_fonts: ^6.1.0

  # Swipe actions
  flutter_slidable: ^3.1.1

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  mqtt_client: ^10.6.1
  mjpeg_view: ^1.0.1
  http: ^1.2.2

  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.3.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    # .env dibundle untuk DEV lokal agar `flutter run` biasa langsung jalan.
    # File .env tetap di-ignore git (tidak ikut commit). Untuk RELEASE,
    # pakai --dart-define agar secret tidak tertanam via asset.
    - .env
    - assets/images/logo-nb.png
    - assets/images/logo.png
    - assets/images/logo-kel-merak.png
    - assets/images/logo-pertamina.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
